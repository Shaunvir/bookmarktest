<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DJ Knowledge's Party Dodge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0012;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', sans-serif;
        }
        
        #gameWrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 800px;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            box-shadow: 
                0 0 80px rgba(255, 0, 150, 0.2),
                0 0 120px rgba(0, 200, 255, 0.1);
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
        }
        
        .stat-box {
            text-align: center;
        }
        
        .stat-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .stat-value {
            font-family: 'Bungee', cursive;
            font-size: 24px;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 0, 150, 0.8),
                0 0 20px rgba(255, 0, 150, 0.4);
        }
        
        .stat-value.level {
            color: #00ffaa;
            text-shadow: 
                0 0 10px rgba(0, 255, 170, 0.8),
                0 0 20px rgba(0, 255, 170, 0.4);
        }
        
        .lives-display {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            justify-content: center;
        }
        
        .life-heart {
            font-size: 16px;
            filter: drop-shadow(0 0 4px rgba(255, 50, 100, 0.8));
            transition: all 0.3s ease;
        }
        
        .life-heart.lost {
            opacity: 0.2;
            filter: none;
            transform: scale(0.8);
        }
        
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, rgba(20, 0, 40, 0.95) 0%, rgba(5, 0, 15, 0.98) 100%);
            z-index: 20;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .overlay-content {
            text-align: center;
            padding: 25px;
            max-width: 380px;
        }
        
        .game-title {
            font-family: 'Bungee', cursive;
            font-size: clamp(22px, 6vw, 32px);
            background: linear-gradient(135deg, #ff0080, #00ffff, #ff0080);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 5px;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .game-subtitle {
            font-size: clamp(14px, 3.5vw, 18px);
            color: #aa88ff;
            margin-bottom: 25px;
        }
        
        .wolf-icon {
            font-size: 56px;
            margin-bottom: 15px;
            animation: wolfBounce 1s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 0, 150, 0.5));
        }
        
        @keyframes wolfBounce {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-8px) rotate(5deg); }
        }
        
        .instructions {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        
        .instruction-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0;
            font-size: 14px;
            color: #ccc;
        }
        
        .instruction-icon {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }
        
        .game-button {
            font-family: 'Bungee', cursive;
            font-size: 18px;
            color: #fff;
            background: linear-gradient(135deg, #ff0080, #7700ff);
            border: none;
            border-radius: 30px;
            padding: 16px 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 
                0 6px 30px rgba(255, 0, 128, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .game-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 10px 40px rgba(255, 0, 128, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        
        .game-button:active {
            transform: translateY(1px);
        }
        
        .controls-hint {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .final-score-label {
            font-size: 14px;
            color: #aa88ff;
            margin-top: 10px;
        }
        
        .final-score {
            font-family: 'Bungee', cursive;
            font-size: 52px;
            background: linear-gradient(135deg, #ff0080, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 5px 0 20px;
        }
        
        .final-level {
            font-size: 16px;
            color: #00ffaa;
            margin-bottom: 20px;
        }
        
        .rank-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 0, 128, 0.2), rgba(0, 255, 255, 0.2));
            border: 1px solid rgba(255, 0, 128, 0.4);
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 12px;
            color: #ff88cc;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        #dpad {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: none;
        }
        
        .dpad-container {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 4px;
        }
        
        .dpad-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        
        .dpad-btn:active, .dpad-btn.active {
            background: rgba(255, 0, 150, 0.4);
            border-color: rgba(255, 0, 150, 0.6);
            color: #fff;
            transform: scale(0.95);
        }
        
        .dpad-btn.up { grid-column: 2; grid-row: 1; }
        .dpad-btn.left { grid-column: 1; grid-row: 2; }
        .dpad-btn.center { grid-column: 2; grid-row: 2; background: transparent; border: none; }
        .dpad-btn.right { grid-column: 3; grid-row: 2; }
        .dpad-btn.down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <div id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            
            <div id="ui">
                <div class="stat-box">
                    <div class="stat-label">Level</div>
                    <div class="stat-value level" id="levelDisplay">1</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="scoreDisplay">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Lives</div>
                    <div class="lives-display" id="livesDisplay"></div>
                </div>
            </div>
            
            <div id="dpad">
                <div class="dpad-container">
                    <div class="dpad-btn up" data-dir="up">▲</div>
                    <div class="dpad-btn left" data-dir="left">◀</div>
                    <div class="dpad-btn center"></div>
                    <div class="dpad-btn right" data-dir="right">▶</div>
                    <div class="dpad-btn down" data-dir="down">▼</div>
                </div>
            </div>
            
            <div id="overlay" data-screen="start">
                <div class="overlay-content" id="startContent">
                    <div class="wolf-icon">🐺</div>
                    <h1 class="game-title">DJ Knowledge</h1>
                    <p class="game-subtitle">Party Dodge!</p>
                    <div class="instructions">
                        <div class="instruction-row">
                            <span class="instruction-icon">🏠</span>
                            <span>Guide DJ Knowledge to his house at the top</span>
                        </div>
                        <div class="instruction-row">
                            <span class="instruction-icon">💃</span>
                            <span>Avoid the dancing party-goers</span>
                        </div>
                        <div class="instruction-row">
                            <span class="instruction-icon">⬆️</span>
                            <span>Each level gets faster and crazier!</span>
                        </div>
                    </div>
                    <button class="game-button" id="startBtn">Let's Party!</button>
                    <div class="controls-hint">Arrow Keys / WASD / D-Pad</div>
                </div>
                
                <div class="overlay-content" id="gameOverContent" style="display: none;">
                    <div class="wolf-icon" style="animation: none; opacity: 0.5;">🐺</div>
                    <h1 class="game-title" style="font-size: 28px;">Party Over!</h1>
                    <div class="final-score-label">Final Score</div>
                    <div class="final-score" id="finalScore">0</div>
                    <div class="final-level">Level <span id="finalLevel">1</span> Reached</div>
                    <div class="rank-badge" id="rankBadge">Party Starter</div>
                    <button class="game-button" id="restartBtn">Try Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // GAME CONFIGURATION
        // ============================================
        const CONFIG = {
            // Grid-based movement
            GRID_SIZE: 50,
            MOVE_SPEED: 8, // Grid cells per second for smooth movement
            
            // Player
            PLAYER_SIZE: 44,
            
            // Party rows
            NUM_ROWS: 5,
            ROW_HEIGHT: 70,
            PARTIER_BASE_SPEED: 80,
            PARTIER_SPEED_VARIANCE: 40,
            PARTIERS_PER_ROW_MIN: 2,
            PARTIERS_PER_ROW_MAX: 4,
            
            // Difficulty
            SPEED_INCREASE_PER_LEVEL: 0.15,
            EXTRA_PARTIER_EVERY_N_LEVELS: 3,
            
            // Physics
            FIXED_TIMESTEP: 1 / 60,
            
            // Scoring
            POINTS_PER_LEVEL: 100,
            
            // Lives
            STARTING_LIVES: 3,
        };

        // ============================================
        // CANVAS SETUP
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let canvasWidth = 400, canvasHeight = 700, scale = 1;
        
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const rect = container.getBoundingClientRect();
            
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            
            canvasWidth = rect.width;
            canvasHeight = rect.height;
            
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';
            
            ctx.scale(dpr, dpr);
            
            scale = Math.min(canvasWidth / 400, canvasHeight / 700);
        }
        
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (typeof player !== 'undefined') {
                // Recalculate bounds
                player.x = Math.min(player.x, canvasWidth - CONFIG.PLAYER_SIZE * scale);
                player.y = Math.min(player.y, canvasHeight - CONFIG.PLAYER_SIZE * scale);
            }
        });

        // ============================================
        // GAME STATE
        // ============================================
        let gameState = 'start';
        let score = 0;
        let lives = CONFIG.STARTING_LIVES;
        let level = 1;
        let speedMultiplier = 1;
        
        let lastTime = 0;
        let accumulator = 0;
        
        // Visual effects
        let hitFlash = 0;
        let winFlash = 0;
        let discoPhase = 0;

        // ============================================
        // GAME OBJECTS
        // ============================================
        const player = {
            x: 0,
            y: 0,
            targetX: 0,
            targetY: 0,
            size: CONFIG.PLAYER_SIZE,
            isMoving: false,
            invincible: 0
        };
        
        const partyRows = [];
        const particles = [];
        
        // House position
        let houseY = 0;
        let safeZoneBottom = 0;

        // ============================================
        // COLORS
        // ============================================
        const COLORS = {
            grass1: '#1a4a2e',
            grass2: '#145028',
            house: '#4a3728',
            roof: '#8b2252',
            door: '#2a1a10',
            neonPink: '#ff0080',
            neonCyan: '#00ffff',
            neonPurple: '#aa00ff',
            neonGreen: '#00ff88',
        };
        
        const PARTIER_COLORS = [
            { body: '#ff0080', accent: '#ff66b2' },
            { body: '#00ffff', accent: '#66ffff' },
            { body: '#aa00ff', accent: '#cc66ff' },
            { body: '#ffaa00', accent: '#ffcc66' },
            { body: '#00ff88', accent: '#66ffaa' },
            { body: '#ff4444', accent: '#ff8888' },
        ];
        
        // Helper function to convert hex color to rgba
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // ============================================
        // INPUT HANDLING
        // ============================================
        const keys = {
            up: false,
            down: false,
            left: false,
            right: false
        };
        
        const inputQueue = [];
        
        document.addEventListener('keydown', (e) => {
            if (gameState !== 'playing') return;
            
            let dir = null;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dir = 'up';
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dir = 'down';
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dir = 'left';
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dir = 'right';
            
            if (dir) {
                e.preventDefault();
                keys[dir] = true;
                if (!player.isMoving) {
                    tryMove(dir);
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });
        
        function setupDpad() {
            const dpad = document.getElementById('dpad');
            const buttons = dpad.querySelectorAll('.dpad-btn[data-dir]');
            
            // Show dpad on touch devices
            if ('ontouchstart' in window) {
                dpad.style.display = 'block';
            }
            
            buttons.forEach(btn => {
                const dir = btn.dataset.dir;
                
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    btn.classList.add('active');
                    if (gameState === 'playing' && !player.isMoving) {
                        tryMove(dir);
                    }
                }, { passive: false });
                
                btn.addEventListener('touchend', () => {
                    btn.classList.remove('active');
                });
                
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    btn.classList.add('active');
                    if (gameState === 'playing' && !player.isMoving) {
                        tryMove(dir);
                    }
                });
                
                btn.addEventListener('mouseup', () => {
                    btn.classList.remove('active');
                });
                
                btn.addEventListener('mouseleave', () => {
                    btn.classList.remove('active');
                });
            });
        }
        
        function tryMove(dir) {
            if (player.isMoving) return;
            
            const gridSize = CONFIG.GRID_SIZE * scale;
            let newX = player.targetX;
            let newY = player.targetY;
            
            if (dir === 'up') newY -= gridSize;
            if (dir === 'down') newY += gridSize;
            if (dir === 'left') newX -= gridSize;
            if (dir === 'right') newX += gridSize;
            
            // Bounds check
            const size = CONFIG.PLAYER_SIZE * scale;
            if (newX < 0 || newX > canvasWidth - size) return;
            if (newY < houseY || newY > canvasHeight - size - 10 * scale) return;
            
            player.targetX = newX;
            player.targetY = newY;
            player.isMoving = true;
        }

        // ============================================
        // BUTTON HANDLERS
        // ============================================
        function setupButtons() {
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
        }

        // ============================================
        // GAME LIFECYCLE
        // ============================================
        function startGame() {
            gameState = 'playing';
            document.getElementById('overlay').classList.add('hidden');
            
            if ('ontouchstart' in window) {
                document.getElementById('dpad').style.display = 'block';
            }
            
            resetGame();
        }
        
        function resetGame() {
            score = 0;
            lives = CONFIG.STARTING_LIVES;
            level = 1;
            speedMultiplier = 1;
            hitFlash = 0;
            winFlash = 0;
            
            initializeLevel();
            updateUI();
        }
        
        function initializeLevel() {
            // Calculate zones
            const topPadding = 80 * scale;
            houseY = topPadding;
            safeZoneBottom = canvasHeight - 60 * scale;
            
            // Reset player position
            const gridSize = CONFIG.GRID_SIZE * scale;
            player.x = Math.floor(canvasWidth / 2 / gridSize) * gridSize;
            player.y = safeZoneBottom - CONFIG.PLAYER_SIZE * scale;
            player.targetX = player.x;
            player.targetY = player.y;
            player.isMoving = false;
            player.invincible = 0;
            
            // Create party rows
            partyRows.length = 0;
            
            const rowAreaTop = houseY + 60 * scale;
            const rowAreaBottom = safeZoneBottom - 20 * scale;
            const rowSpacing = (rowAreaBottom - rowAreaTop) / CONFIG.NUM_ROWS;
            
            for (let i = 0; i < CONFIG.NUM_ROWS; i++) {
                const rowY = rowAreaTop + i * rowSpacing + rowSpacing / 2;
                const direction = i % 2 === 0 ? 1 : -1;
                const baseSpeed = CONFIG.PARTIER_BASE_SPEED + Math.random() * CONFIG.PARTIER_SPEED_VARIANCE;
                
                const row = {
                    y: rowY,
                    direction: direction,
                    speed: baseSpeed * speedMultiplier,
                    partiers: []
                };
                
                // Add partiers
                const numPartiers = CONFIG.PARTIERS_PER_ROW_MIN + 
                    Math.floor(Math.random() * (CONFIG.PARTIERS_PER_ROW_MAX - CONFIG.PARTIERS_PER_ROW_MIN + 1)) +
                    Math.floor(level / CONFIG.EXTRA_PARTIER_EVERY_N_LEVELS);
                
                const spacing = canvasWidth / numPartiers;
                
                for (let j = 0; j < numPartiers; j++) {
                    const colorScheme = PARTIER_COLORS[Math.floor(Math.random() * PARTIER_COLORS.length)];
                    row.partiers.push({
                        x: j * spacing + Math.random() * spacing * 0.5,
                        width: (28 + Math.random() * 10) * scale,
                        height: (40 + Math.random() * 8) * scale,
                        color: colorScheme.body,
                        accent: colorScheme.accent,
                        dancePhase: Math.random() * Math.PI * 2,
                        danceSpeed: 4 + Math.random() * 3
                    });
                }
                
                partyRows.push(row);
            }
            
            particles.length = 0;
        }
        
        function nextLevel() {
            level++;
            score += CONFIG.POINTS_PER_LEVEL * level;
            speedMultiplier = 1 + (level - 1) * CONFIG.SPEED_INCREASE_PER_LEVEL;
            winFlash = 0.4;
            
            // Create celebration particles
            for (let i = 0; i < 30; i++) {
                createConfetti(player.x + CONFIG.PLAYER_SIZE * scale / 2, player.y);
            }
            
            initializeLevel();
            updateUI();
        }
        
        function hitPlayer() {
            if (player.invincible > 0) return;
            
            lives--;
            hitFlash = 0.3;
            player.invincible = 1.5;
            
            // Create hit particles
            for (let i = 0; i < 15; i++) {
                createSparkle(
                    player.x + CONFIG.PLAYER_SIZE * scale / 2,
                    player.y + CONFIG.PLAYER_SIZE * scale / 2,
                    '#ff0000'
                );
            }
            
            updateUI();
            
            if (lives <= 0) {
                gameOver();
            } else {
                // Reset position
                player.x = Math.floor(canvasWidth / 2 / (CONFIG.GRID_SIZE * scale)) * (CONFIG.GRID_SIZE * scale);
                player.y = safeZoneBottom - CONFIG.PLAYER_SIZE * scale;
                player.targetX = player.x;
                player.targetY = player.y;
                player.isMoving = false;
            }
        }
        
        function gameOver() {
            gameState = 'gameOver';
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
            
            // Set rank
            const rankBadge = document.getElementById('rankBadge');
            if (score < 100) rankBadge.textContent = 'Party Starter';
            else if (score < 300) rankBadge.textContent = 'Dance Floor Regular';
            else if (score < 600) rankBadge.textContent = 'Groove Master';
            else if (score < 1000) rankBadge.textContent = 'DJ Apprentice';
            else if (score < 1500) rankBadge.textContent = 'Party Legend';
            else rankBadge.textContent = 'Ultimate DJ';
            
            document.getElementById('startContent').style.display = 'none';
            document.getElementById('gameOverContent').style.display = 'block';
            document.getElementById('overlay').classList.remove('hidden');
        }
        
        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('levelDisplay').textContent = level;
            
            const livesDisplay = document.getElementById('livesDisplay');
            livesDisplay.innerHTML = '';
            for (let i = 0; i < CONFIG.STARTING_LIVES; i++) {
                const heart = document.createElement('span');
                heart.className = 'life-heart' + (i >= lives ? ' lost' : '');
                heart.textContent = '❤️';
                livesDisplay.appendChild(heart);
            }
        }

        // ============================================
        // PARTICLE SYSTEM
        // ============================================
        function createConfetti(x, y) {
            const colors = ['#ff0080', '#00ffff', '#ffaa00', '#00ff88', '#aa00ff'];
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 300 * scale,
                vy: -200 * scale - Math.random() * 200 * scale,
                size: (4 + Math.random() * 4) * scale,
                color: colors[Math.floor(Math.random() * colors.length)],
                life: 1,
                decay: 0.8 + Math.random() * 0.4,
                gravity: 400 * scale,
                rotation: Math.random() * Math.PI * 2,
                rotationSpeed: (Math.random() - 0.5) * 10
            });
        }
        
        function createSparkle(x, y, color) {
            const angle = Math.random() * Math.PI * 2;
            const speed = (100 + Math.random() * 150) * scale;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: (3 + Math.random() * 4) * scale,
                color: color,
                life: 1,
                decay: 2 + Math.random(),
                gravity: 0,
                rotation: 0,
                rotationSpeed: 0
            });
        }
        
        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += p.gravity * dt;
                p.life -= p.decay * dt;
                p.rotation += p.rotationSpeed * dt;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // ============================================
        // UPDATE LOGIC
        // ============================================
        function update(dt) {
            if (gameState !== 'playing') return;
            
            discoPhase += dt * 2;
            
            // Update player movement (smooth interpolation)
            if (player.isMoving) {
                const moveSpeed = CONFIG.MOVE_SPEED * CONFIG.GRID_SIZE * scale * dt;
                const dx = player.targetX - player.x;
                const dy = player.targetY - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < moveSpeed) {
                    player.x = player.targetX;
                    player.y = player.targetY;
                    player.isMoving = false;
                    
                    // Check for queued input
                    if (keys.up) tryMove('up');
                    else if (keys.down) tryMove('down');
                    else if (keys.left) tryMove('left');
                    else if (keys.right) tryMove('right');
                } else {
                    player.x += (dx / dist) * moveSpeed;
                    player.y += (dy / dist) * moveSpeed;
                }
            }
            
            // Update invincibility
            if (player.invincible > 0) {
                player.invincible -= dt;
            }
            
            // Update party rows
            partyRows.forEach(row => {
                row.partiers.forEach(p => {
                    p.x += row.direction * row.speed * scale * dt;
                    p.dancePhase += p.danceSpeed * dt;
                    
                    // Wrap around
                    if (row.direction > 0 && p.x > canvasWidth + 50) {
                        p.x = -p.width - 20;
                    } else if (row.direction < 0 && p.x < -p.width - 50) {
                        p.x = canvasWidth + 20;
                    }
                });
            });
            
            // Check collisions
            if (player.invincible <= 0) {
                const playerSize = CONFIG.PLAYER_SIZE * scale;
                const hitPadding = 6 * scale;
                
                partyRows.forEach(row => {
                    row.partiers.forEach(p => {
                        // Simple AABB collision
                        if (player.x + hitPadding < p.x + p.width &&
                            player.x + playerSize - hitPadding > p.x &&
                            player.y + hitPadding < row.y + p.height / 2 &&
                            player.y + playerSize - hitPadding > row.y - p.height / 2) {
                            hitPlayer();
                        }
                    });
                });
            }
            
            // Check win condition
            if (player.y <= houseY + 20 * scale) {
                nextLevel();
            }
            
            // Update particles
            updateParticles(dt);
            
            // Update flash effects
            if (hitFlash > 0) hitFlash -= dt;
            if (winFlash > 0) winFlash -= dt;
        }

        // ============================================
        // DRAWING FUNCTIONS
        // ============================================
        function drawBackground() {
            // Gradient sky/lawn
            const gradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
            gradient.addColorStop(0, '#0a0015');
            gradient.addColorStop(0.2, '#150025');
            gradient.addColorStop(0.5, '#1a1a30');
            gradient.addColorStop(1, '#0a2020');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            // Disco lights effect
            const numLights = 5;
            for (let i = 0; i < numLights; i++) {
                const lightX = canvasWidth * (i + 0.5) / numLights;
                const lightY = 50 * scale;
                const phase = discoPhase + i * 1.3;
                const radius = (100 + Math.sin(phase) * 30) * scale;
                
                const colors = [COLORS.neonPink, COLORS.neonCyan, COLORS.neonPurple, COLORS.neonGreen];
                const color = colors[i % colors.length];
                
                // Convert hex to RGB values
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                const alpha = 0.08 + Math.sin(phase) * 0.04;
                
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(lightX, lightY + radius * 0.5, radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Lawn stripes
            const stripeHeight = 30 * scale;
            for (let y = houseY + 60 * scale; y < canvasHeight; y += stripeHeight * 2) {
                ctx.fillStyle = 'rgba(0, 60, 30, 0.3)';
                ctx.fillRect(0, y, canvasWidth, stripeHeight);
            }
            
            // House
            drawHouse();
            
            // Safe zone at bottom
            ctx.fillStyle = 'rgba(0, 100, 50, 0.4)';
            ctx.fillRect(0, safeZoneBottom - 10 * scale, canvasWidth, canvasHeight - safeZoneBottom + 10 * scale);
            
            // Safe zone glow
            const safeGradient = ctx.createLinearGradient(0, safeZoneBottom - 20 * scale, 0, safeZoneBottom + 10 * scale);
            safeGradient.addColorStop(0, 'transparent');
            safeGradient.addColorStop(1, 'rgba(0, 255, 100, 0.1)');
            ctx.fillStyle = safeGradient;
            ctx.fillRect(0, safeZoneBottom - 20 * scale, canvasWidth, 30 * scale);
        }
        
        function drawHouse() {
            const hx = canvasWidth / 2;
            const hy = houseY + 30 * scale;
            const hw = 100 * scale;
            const hh = 50 * scale;
            
            // House glow
            ctx.fillStyle = 'rgba(255, 200, 100, 0.1)';
            ctx.beginPath();
            ctx.arc(hx, hy, hw * 0.8, 0, Math.PI * 2);
            ctx.fill();
            
            // House body
            ctx.fillStyle = COLORS.house;
            ctx.fillRect(hx - hw/2, hy, hw, hh);
            
            // Roof
            ctx.fillStyle = COLORS.roof;
            ctx.beginPath();
            ctx.moveTo(hx - hw/2 - 15 * scale, hy);
            ctx.lineTo(hx, hy - 35 * scale);
            ctx.lineTo(hx + hw/2 + 15 * scale, hy);
            ctx.closePath();
            ctx.fill();
            
            // Door
            ctx.fillStyle = COLORS.door;
            ctx.fillRect(hx - 12 * scale, hy + 15 * scale, 24 * scale, 35 * scale);
            
            // Door glow (welcoming!)
            ctx.fillStyle = 'rgba(255, 200, 100, 0.3)';
            ctx.fillRect(hx - 10 * scale, hy + 17 * scale, 20 * scale, 31 * scale);
            
            // Windows
            ctx.fillStyle = 'rgba(255, 230, 150, 0.6)';
            ctx.fillRect(hx - hw/2 + 10 * scale, hy + 10 * scale, 18 * scale, 18 * scale);
            ctx.fillRect(hx + hw/2 - 28 * scale, hy + 10 * scale, 18 * scale, 18 * scale);
            
            // Doorknob
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(hx + 8 * scale, hy + 35 * scale, 3 * scale, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawPartiers() {
            partyRows.forEach(row => {
                row.partiers.forEach(p => {
                    const dance = Math.sin(p.dancePhase) * 3 * scale;
                    const sway = Math.sin(p.dancePhase * 0.5) * 2 * scale;
                    
                    ctx.save();
                    ctx.translate(p.x + p.width/2, row.y);
                    ctx.rotate(Math.sin(p.dancePhase) * 0.1);
                    
                    // Glow
                    ctx.fillStyle = hexToRgba(p.color, 0.2);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.width * 0.8, p.height * 0.6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Body
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.width/2 + sway, -p.height/2 + dance, p.width, p.height * 0.7);
                    
                    // Head
                    ctx.beginPath();
                    ctx.arc(sway, -p.height/2 + dance - 8 * scale, p.width * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Arms (dancing!)
                    ctx.fillStyle = p.accent;
                    const armAngle = Math.sin(p.dancePhase * 2) * 0.5;
                    
                    ctx.save();
                    ctx.translate(-p.width/2 + sway, -p.height/4 + dance);
                    ctx.rotate(-0.5 - armAngle);
                    ctx.fillRect(-3 * scale, 0, 6 * scale, p.height * 0.4);
                    ctx.restore();
                    
                    ctx.save();
                    ctx.translate(p.width/2 + sway, -p.height/4 + dance);
                    ctx.rotate(0.5 + armAngle);
                    ctx.fillRect(-3 * scale, 0, 6 * scale, p.height * 0.4);
                    ctx.restore();
                    
                    // Party hat
                    ctx.fillStyle = '#ff00ff';
                    ctx.beginPath();
                    ctx.moveTo(sway, -p.height/2 + dance - 20 * scale);
                    ctx.lineTo(sway - 8 * scale, -p.height/2 + dance - 5 * scale);
                    ctx.lineTo(sway + 8 * scale, -p.height/2 + dance - 5 * scale);
                    ctx.closePath();
                    ctx.fill();
                    
                    // Hat pom-pom
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(sway, -p.height/2 + dance - 22 * scale, 4 * scale, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                });
            });
        }
        
        function drawDJKnowledge() {
            const s = scale;
            const px = player.x;
            const py = player.y;
            const size = CONFIG.PLAYER_SIZE * s;
            
            // Invincibility blink
            if (player.invincible > 0 && Math.floor(player.invincible * 10) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            
            ctx.save();
            ctx.translate(px + size/2, py + size/2);
            
            // Glow effect
            ctx.fillStyle = 'rgba(255, 0, 150, 0.2)';
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.7, 0, Math.PI * 2);
            ctx.fill();
            
            // Body
            ctx.fillStyle = '#444466';
            ctx.fillRect(-size * 0.35, -size * 0.1, size * 0.7, size * 0.5);
            
            // Legs
            ctx.fillStyle = '#333344';
            ctx.fillRect(-size * 0.25, size * 0.35, size * 0.2, size * 0.15);
            ctx.fillRect(size * 0.05, size * 0.35, size * 0.2, size * 0.15);
            
            // Head (wolf)
            ctx.fillStyle = '#666688';
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.2, size * 0.35, size * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Ears
            ctx.fillStyle = '#555577';
            ctx.beginPath();
            ctx.moveTo(-size * 0.25, -size * 0.35);
            ctx.lineTo(-size * 0.35, -size * 0.55);
            ctx.lineTo(-size * 0.15, -size * 0.4);
            ctx.closePath();
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(size * 0.25, -size * 0.35);
            ctx.lineTo(size * 0.35, -size * 0.55);
            ctx.lineTo(size * 0.15, -size * 0.4);
            ctx.closePath();
            ctx.fill();
            
            // Inner ears
            ctx.fillStyle = '#887799';
            ctx.beginPath();
            ctx.moveTo(-size * 0.22, -size * 0.38);
            ctx.lineTo(-size * 0.28, -size * 0.48);
            ctx.lineTo(-size * 0.18, -size * 0.4);
            ctx.closePath();
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(size * 0.22, -size * 0.38);
            ctx.lineTo(size * 0.28, -size * 0.48);
            ctx.lineTo(size * 0.18, -size * 0.4);
            ctx.closePath();
            ctx.fill();
            
            // Snout
            ctx.fillStyle = '#777799';
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.08, size * 0.18, size * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Nose
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.12, size * 0.06, size * 0.04, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // COOL SUNGLASSES
            ctx.fillStyle = '#111';
            // Frame
            ctx.fillRect(-size * 0.32, -size * 0.28, size * 0.64, size * 0.04);
            // Left lens
            ctx.beginPath();
            ctx.ellipse(-size * 0.15, -size * 0.24, size * 0.12, size * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();
            // Right lens
            ctx.beginPath();
            ctx.ellipse(size * 0.15, -size * 0.24, size * 0.12, size * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Lens shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.beginPath();
            ctx.ellipse(-size * 0.18, -size * 0.26, size * 0.04, size * 0.03, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(size * 0.12, -size * 0.26, size * 0.04, size * 0.03, -0.3, 0, Math.PI * 2);
            ctx.fill();
            
            // Headphones
            ctx.fillStyle = '#ff0080';
            ctx.strokeStyle = '#ff0080';
            ctx.lineWidth = 4 * s;
            ctx.beginPath();
            ctx.arc(0, -size * 0.3, size * 0.38, Math.PI * 1.2, Math.PI * 1.8);
            ctx.stroke();
            
            // Headphone cups
            ctx.fillStyle = '#cc0066';
            ctx.beginPath();
            ctx.ellipse(-size * 0.35, -size * 0.2, size * 0.08, size * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(size * 0.35, -size * 0.2, size * 0.08, size * 0.12, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            ctx.globalAlpha = 1;
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                ctx.restore();
            });
        }
        
        function drawFlashEffects() {
            if (hitFlash > 0) {
                ctx.fillStyle = `rgba(255, 0, 0, ${hitFlash * 0.5})`;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            }
            
            if (winFlash > 0) {
                ctx.fillStyle = `rgba(0, 255, 150, ${winFlash * 0.4})`;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            }
        }

        // ============================================
        // MAIN GAME LOOP
        // ============================================
        function gameLoop(currentTime) {
            currentTime *= 0.001;
            
            if (lastTime === 0) {
                lastTime = currentTime;
            }
            
            let deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            deltaTime = Math.min(deltaTime, 0.1);
            
            accumulator += deltaTime;
            
            while (accumulator >= CONFIG.FIXED_TIMESTEP) {
                update(CONFIG.FIXED_TIMESTEP);
                accumulator -= CONFIG.FIXED_TIMESTEP;
            }
            
            // Render
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            drawBackground();
            drawPartiers();
            drawParticles();
            drawDJKnowledge();
            drawFlashEffects();
            
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            resizeCanvas();
            setupButtons();
            setupDpad();
            
            houseY = 80 * scale;
            safeZoneBottom = canvasHeight - 60 * scale;
            
            player.x = canvasWidth / 2 - CONFIG.PLAYER_SIZE * scale / 2;
            player.y = safeZoneBottom - CONFIG.PLAYER_SIZE * scale;
            player.targetX = player.x;
            player.targetY = player.y;
            
            initializeLevel();
            updateUI();
            
            // Initial render
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            drawBackground();
            drawPartiers();
            drawDJKnowledge();
            
            requestAnimationFrame(gameLoop);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
