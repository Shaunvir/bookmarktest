<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professor Joban's Boulder Catch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Teko:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a0a05;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
        }
        
        #gameWrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 800px;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            box-shadow: 
                0 0 80px rgba(255, 150, 50, 0.15),
                inset 0 0 60px rgba(0, 0, 0, 0.3);
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 100%);
        }
        
        .stat-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            color: rgba(255, 220, 180, 0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .stat-value {
            font-family: 'Teko', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: #ffd700;
            text-shadow: 
                0 0 10px rgba(255, 200, 50, 0.5),
                0 2px 4px rgba(0, 0, 0, 0.5);
            line-height: 1;
        }
        
        .stat-value.lives {
            color: #ff6b6b;
        }
        
        .lives-display {
            display: flex;
            gap: 4px;
            margin-top: 2px;
        }
        
        .life-icon {
            width: 12px;
            height: 12px;
            background: #ff6b6b;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 100, 100, 0.6);
            transition: all 0.3s ease;
        }
        
        .life-icon.lost {
            background: #333;
            box-shadow: none;
            transform: scale(0.8);
        }
        
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, rgba(30, 15, 5, 0.9) 0%, rgba(10, 5, 2, 0.95) 100%);
            z-index: 20;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .overlay-content {
            text-align: center;
            padding: 30px;
            max-width: 380px;
        }
        
        .game-title {
            font-family: 'Teko', sans-serif;
            font-size: clamp(28px, 7vw, 42px);
            font-weight: 600;
            color: #ffd700;
            text-shadow: 
                0 0 20px rgba(255, 200, 50, 0.5),
                0 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 5px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        .game-subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(14px, 3.5vw, 18px);
            color: #cc9966;
            margin-bottom: 25px;
        }
        
        .professor-icon {
            font-size: 64px;
            margin-bottom: 15px;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .instructions {
            font-size: clamp(13px, 3vw, 15px);
            color: #aa8866;
            line-height: 1.8;
            margin-bottom: 25px;
        }
        
        .instruction-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 8px 0;
        }
        
        .instruction-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .instruction-icon.gold {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            box-shadow: 0 0 10px rgba(255, 200, 50, 0.5);
        }
        
        .instruction-icon.black {
            background: #2a2a2a;
            border: 2px solid #444;
        }
        
        .game-button {
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(180deg, #d4a340 0%, #8b6914 100%);
            border: none;
            border-radius: 8px;
            padding: 14px 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 200, 0.3),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }
        
        .game-button:hover {
            background: linear-gradient(180deg, #e8b84a 0%, #9d7818 100%);
            transform: translateY(-2px);
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 200, 0.4);
        }
        
        .game-button:active {
            transform: translateY(1px);
        }
        
        .controls-hint {
            margin-top: 20px;
            font-size: 12px;
            color: rgba(200, 160, 120, 0.6);
        }
        
        .final-score-label {
            font-size: 14px;
            color: #aa8866;
            margin-top: 10px;
        }
        
        .final-score {
            font-family: 'Teko', sans-serif;
            font-size: 56px;
            font-weight: 600;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 200, 50, 0.5);
            line-height: 1;
            margin-bottom: 5px;
        }
        
        .final-level {
            font-size: 16px;
            color: #cc9966;
            margin-bottom: 25px;
        }
        
        .rank-badge {
            display: inline-block;
            background: rgba(255, 200, 50, 0.15);
            border: 1px solid rgba(255, 200, 50, 0.3);
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 13px;
            color: #ffd700;
            margin-bottom: 20px;
        }
        
        #touchZones {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            display: flex;
            z-index: 5;
            pointer-events: none;
        }
        
        .touch-zone {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 20px;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .touch-zone:active {
            opacity: 1;
            background: radial-gradient(ellipse at bottom, rgba(255, 200, 100, 0.1) 0%, transparent 70%);
        }
        
        .touch-arrow {
            font-size: 24px;
            color: rgba(255, 200, 100, 0.4);
        }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <div id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            
            <div id="ui">
                <div class="stat-group">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="scoreDisplay">0</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">Level</div>
                    <div class="stat-value" id="levelDisplay">1</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">Lives</div>
                    <div class="lives-display" id="livesDisplay"></div>
                </div>
            </div>
            
            <div id="touchZones" style="display: none;">
                <div class="touch-zone" id="leftZone">
                    <span class="touch-arrow">◀</span>
                </div>
                <div class="touch-zone" id="rightZone">
                    <span class="touch-arrow">▶</span>
                </div>
            </div>
            
            <div id="overlay" data-screen="start">
                <div class="overlay-content" id="startContent">
                    <div class="professor-icon">🏔️</div>
                    <h1 class="game-title">Professor Joban's</h1>
                    <p class="game-subtitle">Boulder Catch</p>
                    <div class="instructions">
                        <div class="instruction-item">
                            <span class="instruction-icon gold">✦</span>
                            <span>Catch <strong style="color:#ffd700">gold boulders</strong> for points</span>
                        </div>
                        <div class="instruction-item">
                            <span class="instruction-icon black">✕</span>
                            <span>Avoid <strong style="color:#888">black boulders</strong></span>
                        </div>
                    </div>
                    <button class="game-button" id="startBtn">Start Game</button>
                    <div class="controls-hint">
                        ← → Arrow Keys / A D / Tap Screen Sides
                    </div>
                </div>
                
                <div class="overlay-content" id="gameOverContent" style="display: none;">
                    <div class="game-title" style="font-size: 32px;">Game Over</div>
                    <div class="final-score-label">Final Score</div>
                    <div class="final-score" id="finalScore">0</div>
                    <div class="final-level">Level <span id="finalLevel">1</span> Reached</div>
                    <div class="rank-badge" id="rankBadge">Novice Collector</div>
                    <button class="game-button" id="restartBtn">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Polyfill for roundRect (for older browsers)
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }
        
        // ============================================
        // GAME CONFIGURATION
        // ============================================
        const CONFIG = {
            // Player physics (pixels per second)
            PLAYER_SPEED: 400,
            PLAYER_WIDTH: 60,
            PLAYER_HEIGHT: 80,
            
            // Boulder settings
            BOULDER_MIN_SIZE: 30,
            BOULDER_MAX_SIZE: 50,
            BOULDER_BASE_SPEED: 150,
            BOULDER_SPEED_VARIANCE: 100,
            GOLD_CHANCE: 0.72,
            
            // Spawning (in seconds)
            BASE_SPAWN_INTERVAL: 0.9,
            MIN_SPAWN_INTERVAL: 0.25,
            
            // Scoring
            BASE_POINTS: 10,
            LEVEL_BONUS: 5,
            POINTS_PER_LEVEL: 100,
            
            // Lives
            STARTING_LIVES: 5,
            
            // Difficulty scaling per level
            SPEED_INCREASE: 0.12,
            SPAWN_DECREASE: 0.06,
            
            // Physics
            TARGET_FPS: 60,
            FIXED_TIMESTEP: 1 / 60,
        };

        // ============================================
        // CANVAS SETUP
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let canvasWidth = 400, canvasHeight = 700, scale = 1;
        
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const rect = container.getBoundingClientRect();
            
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            
            canvasWidth = rect.width;
            canvasHeight = rect.height;
            
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';
            
            ctx.scale(dpr, dpr);
            
            scale = Math.min(canvasWidth / 400, canvasHeight / 700);
        }
        
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (typeof player !== 'undefined' && player) {
                player.y = canvasHeight - CONFIG.PLAYER_HEIGHT * scale - 20 * scale;
                player.x = Math.max(0, Math.min(canvasWidth - CONFIG.PLAYER_WIDTH * scale, player.x));
            }
        });

        // ============================================
        // GAME STATE
        // ============================================
        let gameState = 'start';
        let score = 0;
        let lives = CONFIG.STARTING_LIVES;
        let level = 1;
        
        let lastTime = 0;
        let accumulator = 0;
        let spawnTimer = 0;
        let currentSpawnInterval = CONFIG.BASE_SPAWN_INTERVAL;
        let currentSpeedMultiplier = 1;
        
        // Flash effect
        let damageFlash = 0;
        let catchFlash = 0;

        // ============================================
        // GAME OBJECTS
        // ============================================
        const player = {
            x: 0,
            y: 0,
            width: CONFIG.PLAYER_WIDTH,
            height: CONFIG.PLAYER_HEIGHT,
            targetX: 0,
            velocityX: 0
        };
        
        const boulders = [];
        const particles = [];
        const dustParticles = [];

        // ============================================
        // INPUT HANDLING
        // ============================================
        const keys = {
            left: false,
            right: false
        };
        
        let touchLeft = false;
        let touchRight = false;
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = true;
                e.preventDefault();
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = true;
                e.preventDefault();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = false;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = false;
            }
        });
        
        // Touch controls
        function setupTouchControls() {
            const leftZone = document.getElementById('leftZone');
            const rightZone = document.getElementById('rightZone');
            const touchZones = document.getElementById('touchZones');
            
            // Show touch zones on mobile
            if ('ontouchstart' in window) {
                touchZones.style.display = 'flex';
            }
            
            leftZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchLeft = true;
            }, { passive: false });
            
            leftZone.addEventListener('touchend', () => {
                touchLeft = false;
            });
            
            rightZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touchRight = true;
            }, { passive: false });
            
            rightZone.addEventListener('touchend', () => {
                touchRight = false;
            });
            
            // Also handle touch on canvas directly
            canvas.addEventListener('touchstart', (e) => {
                if (gameState !== 'playing') return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                
                if (touchX < canvasWidth / 2) {
                    touchLeft = true;
                } else {
                    touchRight = true;
                }
            }, { passive: false });
            
            canvas.addEventListener('touchend', () => {
                touchLeft = false;
                touchRight = false;
            });
        }

        // ============================================
        // BUTTON HANDLERS
        // ============================================
        function setupButtons() {
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
        }

        // ============================================
        // GAME LIFECYCLE
        // ============================================
        function startGame() {
            gameState = 'playing';
            document.getElementById('overlay').classList.add('hidden');
            
            if ('ontouchstart' in window) {
                document.getElementById('touchZones').style.display = 'flex';
            }
            
            resetGame();
        }
        
        function resetGame() {
            player.x = canvasWidth / 2 - (CONFIG.PLAYER_WIDTH * scale) / 2;
            player.y = canvasHeight - CONFIG.PLAYER_HEIGHT * scale - 20 * scale;
            player.velocityX = 0;
            
            boulders.length = 0;
            particles.length = 0;
            dustParticles.length = 0;
            
            score = 0;
            lives = CONFIG.STARTING_LIVES;
            level = 1;
            spawnTimer = 0;
            currentSpawnInterval = CONFIG.BASE_SPAWN_INTERVAL;
            currentSpeedMultiplier = 1;
            damageFlash = 0;
            catchFlash = 0;
            
            updateUI();
        }
        
        function gameOver() {
            gameState = 'gameOver';
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
            
            // Set rank
            const rankBadge = document.getElementById('rankBadge');
            if (score < 50) rankBadge.textContent = 'Novice Collector';
            else if (score < 150) rankBadge.textContent = 'Boulder Apprentice';
            else if (score < 300) rankBadge.textContent = 'Gold Enthusiast';
            else if (score < 500) rankBadge.textContent = 'Master Catcher';
            else if (score < 800) rankBadge.textContent = 'Canyon Legend';
            else rankBadge.textContent = 'Professor Emeritus';
            
            document.getElementById('startContent').style.display = 'none';
            document.getElementById('gameOverContent').style.display = 'block';
            document.getElementById('overlay').classList.remove('hidden');
        }
        
        function updateUI() {
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('levelDisplay').textContent = level;
            
            // Update lives display
            const livesDisplay = document.getElementById('livesDisplay');
            livesDisplay.innerHTML = '';
            for (let i = 0; i < CONFIG.STARTING_LIVES; i++) {
                const life = document.createElement('div');
                life.className = 'life-icon' + (i >= lives ? ' lost' : '');
                livesDisplay.appendChild(life);
            }
        }

        // ============================================
        // PARTICLE SYSTEMS
        // ============================================
        function createCatchParticles(x, y, isGold) {
            const count = isGold ? 12 : 8;
            const colors = isGold ? ['#ffd700', '#ffaa00', '#ff8800'] : ['#555', '#333', '#222'];
            
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                const speed = (100 + Math.random() * 150) * scale;
                
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 100 * scale,
                    size: (4 + Math.random() * 6) * scale,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1,
                    decay: 1.5 + Math.random() * 0.5,
                    gravity: 400 * scale
                });
            }
        }
        
        function createDustTrail(x, y) {
            dustParticles.push({
                x: x + (Math.random() - 0.5) * 20 * scale,
                y: y,
                vy: -20 * scale - Math.random() * 30 * scale,
                size: (2 + Math.random() * 3) * scale,
                life: 1,
                decay: 2 + Math.random()
            });
        }
        
        function updateParticles(dt) {
            // Update catch particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += p.gravity * dt;
                p.life -= p.decay * dt;
                p.size *= Math.pow(0.96, dt * 60);
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // Update dust particles
            for (let i = dustParticles.length - 1; i >= 0; i--) {
                const p = dustParticles[i];
                p.y += p.vy * dt;
                p.life -= p.decay * dt;
                
                if (p.life <= 0) {
                    dustParticles.splice(i, 1);
                }
            }
        }

        // ============================================
        // BOULDER MANAGEMENT
        // ============================================
        function spawnBoulder() {
            const size = (CONFIG.BOULDER_MIN_SIZE + Math.random() * (CONFIG.BOULDER_MAX_SIZE - CONFIG.BOULDER_MIN_SIZE)) * scale;
            const isGold = Math.random() < CONFIG.GOLD_CHANCE;
            
            boulders.push({
                x: size + Math.random() * (canvasWidth - size * 2),
                y: -size,
                size: size,
                speed: (CONFIG.BOULDER_BASE_SPEED + Math.random() * CONFIG.BOULDER_SPEED_VARIANCE) * scale,
                isGold: isGold,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 5,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 2 + Math.random() * 2
            });
        }
        
        function updateBoulders(dt) {
            spawnTimer += dt;
            
            if (spawnTimer >= currentSpawnInterval) {
                spawnBoulder();
                spawnTimer = 0;
            }
            
            const playerScale = scale;
            const pw = CONFIG.PLAYER_WIDTH * playerScale;
            const ph = CONFIG.PLAYER_HEIGHT * playerScale;
            const hitPadding = 8 * playerScale;
            
            for (let i = boulders.length - 1; i >= 0; i--) {
                const b = boulders[i];
                
                b.y += b.speed * currentSpeedMultiplier * dt;
                b.rotation += b.rotationSpeed * dt;
                b.wobble += b.wobbleSpeed * dt;
                b.x += Math.sin(b.wobble) * 0.5 * scale;
                
                // Collision detection
                const bCenterX = b.x;
                const bCenterY = b.y;
                const bRadius = b.size / 2;
                
                const pLeft = player.x + hitPadding;
                const pRight = player.x + pw - hitPadding;
                const pTop = player.y + hitPadding;
                const pBottom = player.y + ph;
                
                // Circle-rectangle collision
                const closestX = Math.max(pLeft, Math.min(bCenterX, pRight));
                const closestY = Math.max(pTop, Math.min(bCenterY, pBottom));
                const distX = bCenterX - closestX;
                const distY = bCenterY - closestY;
                const distSquared = distX * distX + distY * distY;
                
                if (distSquared < bRadius * bRadius) {
                    // Collision!
                    createCatchParticles(b.x, b.y, b.isGold);
                    
                    if (b.isGold) {
                        score += CONFIG.BASE_POINTS + (level * CONFIG.LEVEL_BONUS);
                        catchFlash = 0.15;
                        
                        // Level up check
                        const newLevel = Math.floor(score / CONFIG.POINTS_PER_LEVEL) + 1;
                        if (newLevel > level) {
                            level = newLevel;
                            currentSpeedMultiplier = 1 + (level - 1) * CONFIG.SPEED_INCREASE;
                            currentSpawnInterval = Math.max(
                                CONFIG.MIN_SPAWN_INTERVAL,
                                CONFIG.BASE_SPAWN_INTERVAL - (level - 1) * CONFIG.SPAWN_DECREASE
                            );
                        }
                    } else {
                        lives--;
                        damageFlash = 0.2;
                    }
                    
                    boulders.splice(i, 1);
                    updateUI();
                    
                    if (lives <= 0) {
                        gameOver();
                    }
                    continue;
                }
                
                // Remove off-screen boulders
                if (b.y - b.size > canvasHeight) {
                    boulders.splice(i, 1);
                }
            }
        }

        // ============================================
        // UPDATE LOGIC
        // ============================================
        function update(dt) {
            if (gameState !== 'playing') return;
            
            // Player movement
            let moveDir = 0;
            if (keys.left || touchLeft) moveDir -= 1;
            if (keys.right || touchRight) moveDir += 1;
            
            const targetVelocity = moveDir * CONFIG.PLAYER_SPEED * scale;
            
            // Smooth acceleration
            const accel = 15;
            player.velocityX += (targetVelocity - player.velocityX) * accel * dt;
            player.x += player.velocityX * dt;
            
            // Bounds
            player.x = Math.max(0, Math.min(canvasWidth - CONFIG.PLAYER_WIDTH * scale, player.x));
            
            // Create dust when moving
            if (Math.abs(player.velocityX) > 50 * scale && Math.random() < 0.3) {
                createDustTrail(
                    player.x + (CONFIG.PLAYER_WIDTH * scale) / 2,
                    player.y + CONFIG.PLAYER_HEIGHT * scale
                );
            }
            
            // Update boulders
            updateBoulders(dt);
            
            // Update particles
            updateParticles(dt);
            
            // Update flash effects
            if (damageFlash > 0) damageFlash -= dt;
            if (catchFlash > 0) catchFlash -= dt;
        }

        // ============================================
        // DRAWING FUNCTIONS
        // ============================================
        function drawBackground() {
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
            skyGradient.addColorStop(0, '#1a0505');
            skyGradient.addColorStop(0.3, '#4a2020');
            skyGradient.addColorStop(0.6, '#8b4513');
            skyGradient.addColorStop(0.85, '#cd853f');
            skyGradient.addColorStop(1, '#deb887');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            // Far mountains
            ctx.fillStyle = '#3d1f10';
            drawMountainRange(0.2, 0.5, 80 * scale);
            
            // Mid mountains
            ctx.fillStyle = '#5c2d15';
            drawMountainRange(0.35, 0.4, 120 * scale);
            
            // Near mountains
            ctx.fillStyle = '#6b3a1a';
            drawMountainRange(0.5, 0.3, 150 * scale);
            
            // Ground
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(0, canvasHeight - 30 * scale, canvasWidth, 30 * scale);
            
            // Ground texture
            ctx.fillStyle = '#704820';
            for (let i = 0; i < 20; i++) {
                const x = (i * 47 * scale) % canvasWidth;
                ctx.fillRect(x, canvasHeight - 25 * scale, 8 * scale, 3 * scale);
            }
        }
        
        function drawMountainRange(yPosition, variance, height) {
            ctx.beginPath();
            ctx.moveTo(0, canvasHeight);
            
            let x = 0;
            const baseY = canvasHeight * yPosition;
            
            while (x < canvasWidth + 100) {
                const peakHeight = height * (0.5 + Math.random() * variance);
                const peakX = x + 30 * scale + Math.random() * 40 * scale;
                
                ctx.lineTo(x, baseY);
                ctx.lineTo(peakX, baseY - peakHeight);
                
                x = peakX + 30 * scale + Math.random() * 40 * scale;
            }
            
            ctx.lineTo(canvasWidth, canvasHeight);
            ctx.closePath();
            ctx.fill();
        }
        
        function drawBoulders() {
            boulders.forEach(b => {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.rotation);
                
                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(3 * scale, 3 * scale, b.size / 2, b.size / 2.2, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Boulder body
                if (b.isGold) {
                    const gradient = ctx.createRadialGradient(
                        -b.size * 0.2, -b.size * 0.2, 0,
                        0, 0, b.size / 2
                    );
                    gradient.addColorStop(0, '#fff8dc');
                    gradient.addColorStop(0.3, '#ffd700');
                    gradient.addColorStop(0.7, '#daa520');
                    gradient.addColorStop(1, '#b8860b');
                    ctx.fillStyle = gradient;
                } else {
                    const gradient = ctx.createRadialGradient(
                        -b.size * 0.2, -b.size * 0.2, 0,
                        0, 0, b.size / 2
                    );
                    gradient.addColorStop(0, '#4a4a4a');
                    gradient.addColorStop(0.5, '#2a2a2a');
                    gradient.addColorStop(1, '#1a1a1a');
                    ctx.fillStyle = gradient;
                }
                
                ctx.beginPath();
                ctx.arc(0, 0, b.size / 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Highlight
                ctx.fillStyle = b.isGold ? 'rgba(255, 255, 200, 0.4)' : 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(-b.size * 0.15, -b.size * 0.15, b.size * 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                // Texture spots
                ctx.fillStyle = b.isGold ? '#b8860b' : '#111';
                for (let i = 0; i < 3; i++) {
                    const angle = (i * 2.1) + b.rotation * 0.5;
                    const dist = b.size * 0.25;
                    ctx.beginPath();
                    ctx.arc(
                        Math.cos(angle) * dist,
                        Math.sin(angle) * dist,
                        b.size * 0.08,
                        0, Math.PI * 2
                    );
                    ctx.fill();
                }
                
                ctx.restore();
            });
        }
        
        function drawProfessorJoban() {
            const s = scale;
            const px = player.x;
            const py = player.y;
            const pw = CONFIG.PLAYER_WIDTH * s;
            const ph = CONFIG.PLAYER_HEIGHT * s;
            
            ctx.save();
            
            // Subtle movement animation
            const wobble = Math.sin(Date.now() * 0.005) * 2 * s;
            ctx.translate(px + pw / 2, py + ph / 2 + wobble);
            
            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(0, ph / 2 - 5 * s, pw * 0.4, 8 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Legs
            ctx.fillStyle = '#2c2c4a';
            ctx.fillRect(-12 * s, 15 * s, 10 * s, 25 * s);
            ctx.fillRect(2 * s, 15 * s, 10 * s, 25 * s);
            
            // Shoes
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(-14 * s, 38 * s, 14 * s, 6 * s);
            ctx.fillRect(0, 38 * s, 14 * s, 6 * s);
            
            // Body / Kurta
            ctx.fillStyle = '#e8e0d5';
            ctx.fillRect(-18 * s, -15 * s, 36 * s, 35 * s);
            
            // Kurta collar detail
            ctx.fillStyle = '#d4ccc0';
            ctx.beginPath();
            ctx.moveTo(-8 * s, -15 * s);
            ctx.lineTo(0, -5 * s);
            ctx.lineTo(8 * s, -15 * s);
            ctx.closePath();
            ctx.fill();
            
            // Vest
            ctx.fillStyle = '#4a3728';
            ctx.fillRect(-18 * s, -10 * s, 10 * s, 28 * s);
            ctx.fillRect(8 * s, -10 * s, 10 * s, 28 * s);
            
            // Arms
            ctx.fillStyle = '#e8e0d5';
            ctx.save();
            ctx.translate(-20 * s, -5 * s);
            ctx.rotate(-0.3 + Math.sin(Date.now() * 0.008) * 0.1);
            ctx.fillRect(-5 * s, 0, 10 * s, 25 * s);
            ctx.restore();
            
            ctx.save();
            ctx.translate(20 * s, -5 * s);
            ctx.rotate(0.3 - Math.sin(Date.now() * 0.008) * 0.1);
            ctx.fillRect(-5 * s, 0, 10 * s, 25 * s);
            ctx.restore();
            
            // Hands
            ctx.fillStyle = '#c68642';
            ctx.beginPath();
            ctx.arc(-25 * s, 18 * s, 6 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(25 * s, 18 * s, 6 * s, 0, Math.PI * 2);
            ctx.fill();
            
            // Neck
            ctx.fillStyle = '#c68642';
            ctx.fillRect(-6 * s, -22 * s, 12 * s, 10 * s);
            
            // Head
            ctx.fillStyle = '#c68642';
            ctx.beginPath();
            ctx.ellipse(0, -32 * s, 14 * s, 16 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Beard
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.moveTo(-12 * s, -28 * s);
            ctx.quadraticCurveTo(-14 * s, -18 * s, -8 * s, -12 * s);
            ctx.lineTo(8 * s, -12 * s);
            ctx.quadraticCurveTo(14 * s, -18 * s, 12 * s, -28 * s);
            ctx.quadraticCurveTo(10 * s, -24 * s, 0, -22 * s);
            ctx.quadraticCurveTo(-10 * s, -24 * s, -12 * s, -28 * s);
            ctx.fill();
            
            // Turban base
            ctx.fillStyle = '#d4572a';
            ctx.beginPath();
            ctx.ellipse(0, -42 * s, 18 * s, 12 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Turban folds
            ctx.fillStyle = '#ff6b35';
            ctx.beginPath();
            ctx.ellipse(0, -44 * s, 16 * s, 10 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#e85a28';
            ctx.beginPath();
            ctx.ellipse(0, -46 * s, 14 * s, 8 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ff7744';
            ctx.beginPath();
            ctx.ellipse(0, -48 * s, 10 * s, 6 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Turban peak/crest
            ctx.fillStyle = '#ff8855';
            ctx.beginPath();
            ctx.ellipse(0, -50 * s, 6 * s, 4 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Turban decoration
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(0, -38 * s, 4 * s, 0, Math.PI * 2);
            ctx.fill();
            
            // Sunglasses
            ctx.fillStyle = '#1a1a1a';
            // Frame
            ctx.fillRect(-14 * s, -36 * s, 28 * s, 3 * s);
            // Left lens
            ctx.beginPath();
            ctx.roundRect(-13 * s, -36 * s, 11 * s, 10 * s, 2 * s);
            ctx.fill();
            // Right lens
            ctx.beginPath();
            ctx.roundRect(2 * s, -36 * s, 11 * s, 10 * s, 2 * s);
            ctx.fill();
            
            // Lens shine
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fillRect(-11 * s, -35 * s, 4 * s, 3 * s);
            ctx.fillRect(4 * s, -35 * s, 4 * s, 3 * s);
            
            ctx.restore();
        }
        
        function drawParticles() {
            // Catch particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            
            // Dust particles
            dustParticles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.life * 0.5;
                ctx.fillStyle = '#a08060';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }
        
        function drawFlashEffects() {
            if (damageFlash > 0) {
                ctx.save();
                ctx.fillStyle = `rgba(255, 50, 50, ${damageFlash * 0.4})`;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                ctx.restore();
            }
            
            if (catchFlash > 0) {
                ctx.save();
                ctx.fillStyle = `rgba(255, 215, 0, ${catchFlash * 0.3})`;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                ctx.restore();
            }
        }

        // ============================================
        // MAIN GAME LOOP
        // ============================================
        function gameLoop(currentTime) {
            currentTime *= 0.001;
            
            if (lastTime === 0) {
                lastTime = currentTime;
            }
            
            let deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            // Clamp delta time
            deltaTime = Math.min(deltaTime, 0.1);
            
            // Fixed timestep updates
            accumulator += deltaTime;
            
            while (accumulator >= CONFIG.FIXED_TIMESTEP) {
                update(CONFIG.FIXED_TIMESTEP);
                accumulator -= CONFIG.FIXED_TIMESTEP;
            }
            
            // Render
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            drawBackground();
            drawBoulders();
            drawParticles();
            drawProfessorJoban();
            drawFlashEffects();
            
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            resizeCanvas();
            setupButtons();
            setupTouchControls();
            
            player.x = canvasWidth / 2 - (CONFIG.PLAYER_WIDTH * scale) / 2;
            player.y = canvasHeight - CONFIG.PLAYER_HEIGHT * scale - 20 * scale;
            
            updateUI();
            
            // Initial render
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            drawBackground();
            drawProfessorJoban();
            
            requestAnimationFrame(gameLoop);
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
